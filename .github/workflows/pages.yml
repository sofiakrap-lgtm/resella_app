# Publishes the demo to GitHub Pages.
#
# One time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that every push to the branch below publishes
# a new version at https://<user>.github.io/<repo>/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, claude/tender-carson-5ocims]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static export
        env:
          NEXT_EXPORT: '1'
          # The site is served from /<repo>, so assets and links need the prefix.
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll so the _next folder is served
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
